{% extends "base.html" %}{% block content %}
<div class="card" style="max-width:480px;margin:40px auto"><h2>Create Account</h2>
<form method="post"><label>Name</label><input name="name" required>
<label>Email</label><input type="email" name="email" required>
<label>Password (minimum 6 characters)</label><input type="password" name="password" minlength="6" required>
<label>Account Type</label><select name="role"><option value="individual_owner">Individual Owner</option><option value="fleet_manager">Fleet Manager</option></select>
<button type="submit">Register</button></form><p>Already registered? <a href="/login">Login</a></p></div>{% endblock %}
